name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint
      - name: CLI Smoke Test (Real Binary & Parity Matrix)
        shell: bash
        run: |
          node packages/cli/dist/src/main.js version
          node packages/cli/dist/src/main.js doctor --json
          node packages/cli/dist/src/main.js tools list
          node packages/cli/dist/src/main.js model recommend
          node packages/cli/dist/src/main.js completion bash
          node packages/cli/dist/src/main.js completion zsh
          node packages/cli/dist/src/main.js completion fish
          node packages/cli/dist/src/main.js completion powershell

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit
        run: npm audit --omit=dev || true
      - name: Supply-chain runtime zero-foreign-deps verification
        run: |
          node -e '
            const fs = require("fs");
            for (const dir of fs.readdirSync("packages")) {
              const p = `packages/${dir}/package.json`;
              if (!fs.existsSync(p)) continue;
              const pkg = JSON.parse(fs.readFileSync(p, "utf8"));
              const deps = Object.keys(pkg.dependencies || {});
              const foreign = deps.filter(d => !d.startsWith("@agent-qofeno/"));
              if (foreign.length) {
                console.error(`${pkg.name} has foreign runtime deps: ${foreign}`);
                process.exit(1);
              }
            }
            console.log("✔ Supply-chain check passed: zero foreign runtime dependencies.");'
