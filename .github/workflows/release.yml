name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # npm provenance / attestations

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm test

  npm-publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-release # protected environment; fork PRs can never reach this
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: https://registry.npmjs.org }
      - run: npm ci
      - run: npm run build
      - name: SBOM (CycloneDX)
        run: node scripts/sbom.mjs > sbom.json
      - name: Publish changed packages with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bash scripts/publish-all.sh

  desktop:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux }
          - { os: windows-latest, target: windows }
          - { os: macos-latest, target: macos }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: npm run -w @agent-qofeno/app build
      - name: Install tauri CLI
        run: npm i -g @tauri-apps/cli@2
      - name: Build desktop bundles (signed updater when TAURI_SIGNING_PRIVATE_KEY present)
        working-directory: apps/desktop/src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ "$(uname)" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev >/dev/null || true
          fi
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            tauri build --config tauri.conf.json
          else
            echo "::warning::no updater signing key — building without updater signature"
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD="" tauri build --config tauri.conf.json --bundles deb,appimage,msi,dmg || \
              echo "::warning::some bundle targets unavailable on this runner; artifacts uploaded where produced"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*
          if-no-files-found: ignore
          retention-days: 14

  android:
    needs: verify
    runs-on: ubuntu-latest
    environment: mobile-release # signing creds live here only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: npm run -w @agent-qofeno/app build
      - name: Assemble unsigned APK/AAB (signed only when keystore secrets exist)
        continue-on-error: true
        env:
          QOFENO_KEYSTORE_PASSWORD: ${{ secrets.QOFENO_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$QOFENO_KEYSTORE_PASSWORD" ]; then
            echo "::warning::no signing credentials — producing unsigned artifact"
          fi
          npx @tauri-apps/cli@2 android build --target aarch64 || \
          echo "::warning::android toolchain unavailable on this runner"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-apk
          path: |
            **/*.apk
            **/*.aab
          if-no-files-found: ignore
          retention-days: 14

  github-release:
    needs: [verify, npm-publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Source tarball + checksums + provenance note
        run: |
          mkdir -p dist-release
          git archive --format=tar.gz -o dist-release/qofeno-${GITHUB_REF_NAME}-source.tar.gz HEAD
          node scripts/sbom.mjs > dist-release/sbom.json
          cd dist-release && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          generate_release_notes: true
