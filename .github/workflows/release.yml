name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write   # artifact attestations/provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: SBOM (CycloneDX JSON of workspace manifest graph)
        run: |
          node -e '
            const fs = require("fs");
            const pkgs = [];
            for (const dir of fs.readdirSync("packages").concat("")) {
              const p = dir ? `packages/${dir}/package.json` : "package.json";
              if (fs.existsSync(p)) {
                const j = JSON.parse(fs.readFileSync(p, "utf8"));
                pkgs.push({ name: j.name || "qofeno-root", version: j.version, license: j.license || "Apache-2.0", dependencies: Object.keys(j.dependencies || {}) });
              }
            }
            const sbom = { bomFormat: "CycloneDX", specVersion: "1.5", components: pkgs.map(p => ({ type: "library", name: p.name, version: p.version, licenses: [{ license: { id: p.license } }] })) };
            fs.mkdirSync("dist-release", { recursive: true });
            fs.writeFileSync("dist-release/sbom.json", JSON.stringify(sbom, null, 2));
            console.log("sbom written");'
      - name: Source tarball + checksums
        run: |
          mkdir -p dist-release
          git archive --format=tar.gz -o dist-release/qofeno-${GITHUB_REF_NAME}.tar.gz HEAD
          cd dist-release && sha256sum * > SHA256SUMS.txt
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/*
          generate_release_notes: true
      - name: Publish to npm (@agent-qofeno scope)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for p in core security storage providers runtime term input config session knowledge ctx tools agents workflows ext repl cli server github-bot; do
            if grep -q '"private": true' packages/$p/package.json; then continue; fi
            npm publish packages/$p --access public --provenance || true
          done
