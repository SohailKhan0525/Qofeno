name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      auto_bump:
        description: "Auto-bump version if tag/version already exists on npm"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write # npm provenance / attestations

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint

  version-gate:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      bumped: ${{ steps.bump.outputs.bumped }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: bump
        run: node scripts/check-and-bump-version.mjs

  npm-publish:
    needs: [verify, version-gate]
    runs-on: ubuntu-latest
    environment: npm-release # protected environment with NPM_TOKEN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Sync version
        run: node scripts/check-and-bump-version.mjs
      - run: npm run build
      - name: Inspect package contents (dry-run check)
        run: npm pack --dry-run
      - name: Publish all packages to NPM with provenance & verification
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-all.mjs

  github-release:
    needs: [verify, version-gate, npm-publish]
    if: always() && !cancelled() && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare release metadata & assets
        run: |
          mkdir -p dist-release
          git archive --format=tar.gz -o dist-release/qofeno-${{ needs.version-gate.outputs.version }}-source.tar.gz HEAD
          node scripts/sbom.mjs > dist-release/sbom.json
          cp docs/COMMAND_PARITY.md dist-release/
          cd dist-release && sha256sum * > SHA256SUMS.txt
          echo "=== Prepared NPM Release Assets ==="
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          generate_release_notes: true
